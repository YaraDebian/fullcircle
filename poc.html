<style>
  :root{
    --bg:#eeeae0;
    --page:#1d1b17;
    --surface:#ffffff;
    --surface-2:#f5f2ea;
    --ink:#26231f;
    --ink-soft:#6f6a5c;
    --ink-faint:#a39d8b;
    --accent:#b8752f;
    --accent-soft:#f1e3cc;
    --ring:#2f4a3e;
    --ring-soft:#dfe6e2;
    --danger:#a44634;
    --border:rgba(38,35,31,0.12);
    --btn:#8a6a4a;
    --btn-hover:#75583c;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  #app{
    width:100%;
    max-width:420px;
    background:var(--bg);
    border-radius:28px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:780px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  header{
    padding:calc(22px + env(safe-area-inset-top)) 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .wordmark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .wordmark span{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:-0.01em;
  }
  .ring-icon{width:26px;height:26px;flex-shrink:0;}
  main{
    flex:1;
    overflow-y:auto;
    padding:4px 20px 100px;
  }
  .section-label{
    font-size:12px;
    text-transform:lowercase;
    color:var(--ink-soft);
    margin:22px 0 10px;
    letter-spacing:0.01em;
  }
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border:1px solid transparent;
    transition:border-color .15s ease;
  }
  .card:hover{border-color:var(--border);}
  .card-due{background:var(--accent-soft);}
  .card-due .card-sub{color:var(--accent);font-weight:500;}
  .shuffle-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:12px;padding:11px;
    background:none;border:1px dashed var(--border);
    border-radius:10px;
    font-size:13px;color:var(--ink-soft);cursor:pointer;
  }
  .shuffle-btn svg{width:16px;height:16px;}
  .shuffle-btn:active{transform:scale(0.99);}
  .icon-badge{
    width:38px;height:38px;border-radius:10px;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--accent);
  }
  .icon-badge svg{width:18px;height:18px;}
  .card-body{flex:1;min-width:0;}
  .card-title{font-size:14.5px;font-weight:500;margin:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}
  .card-x{
    color:var(--ink-faint);
    font-size:18px;
    padding:4px;
    flex-shrink:0;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .tile{
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px;
    aspect-ratio:1.15;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    cursor:pointer;
  }
  .tile .icon-badge{width:34px;height:34px;}
  .tile-title{font-size:13px;font-weight:500;margin:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .empty p{font-size:13.5px;line-height:1.6;margin:0;}
  nav{
    position:absolute;
    bottom:0;left:0;right:0;
    max-width:420px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    gap:6px;
  }
  .nav-btn{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:6px;
    color:var(--ink-faint);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:11px;
    cursor:pointer;
  }
  .nav-btn.active{color:var(--ink);}
  .nav-btn svg{width:20px;height:20px;}
  .nav-btn.add-btn{color:#fff;}
  .nav-btn.add-btn .icon-wrap{
    background:var(--btn);
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:2px;
  }
  #frame{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:18px 0 8px;}
  input[type="text"], textarea, input[type="date"]{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  textarea{resize:none;min-height:56px;}
  .type-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .type-chip{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1.5px solid transparent;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    font-size:11px;
    color:var(--ink-soft);
  }
  .type-chip.selected{border-color:var(--accent);color:var(--ink);}
  .type-chip .icon-badge{width:30px;height:30px;margin-bottom:0;}
  .lane-toggle{
    display:flex;
    background:var(--surface);
    border-radius:10px;
    padding:3px;
  }
  .lane-opt{
    flex:1;
    text-align:center;
    padding:9px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .lane-opt.selected{background:var(--btn);color:#fff;}
  .chip-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
  }
  .chip-btn{
    background:var(--surface);
    border:1.5px solid transparent;
    border-radius:10px;
    padding:10px;
    font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    cursor:pointer;
    color:var(--ink);
  }
  .chip-btn.selected{border-color:var(--accent);background:var(--accent-soft);}
  .primary-btn{
    width:100%;
    background:var(--btn);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:13px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    margin-top:22px;
  }
  .primary-btn:active{transform:scale(0.98);}
  .overlay{
    position:absolute;inset:0;
    background:rgba(29,27,23,0.55);
    display:flex;align-items:flex-end;
    z-index:10;
  }
  .sheet{
    background:var(--surface);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:20px 20px 28px;
  }
  .sheet-title{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:600;margin:0 0 2px;}
  .sheet-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ghost-btn{
    background:none;border:1px solid var(--border);
    border-radius:10px;padding:10px;
    font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink-soft);cursor:pointer;
  }
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .stat-card{background:var(--surface);border-radius:var(--radius);padding:14px;}
  .stat-num{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;margin:2px 0 0;}
  .stat-label{font-size:12px;color:var(--ink-soft);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-label{width:70px;font-size:12px;color:var(--ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--ring);}
  .insight{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px;
    margin-top:16px;
    font-family:Georgia,'Times New Roman',serif;
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
  }
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* Fill the whole screen edge-to-edge on phones and when installed as a standalone app,
     instead of showing the small rounded preview card meant for desktop browsing. */
  @media (max-width:480px), (display-mode:standalone){
    body{padding:0;align-items:stretch;}
    #app{
      max-width:100%;
      min-height:100vh;
      min-height:100dvh;
      border-radius:0;
      box-shadow:none;
    }
    nav{ padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app"><div id="frame"><div class="loading">loading your circle…</div></div></div>

<script>
const TYPES = {
  place:  {label:'place',  lane:'intention',   svg:'<path d="M10 2C6.7 2 4 4.7 4 8c0 4.5 6 10 6 10s6-5.5 6-10c0-3.3-2.7-6-6-6z"/><circle cx="10" cy="8" r="2"/>'},
  recipe: {label:'recipe', lane:'intention',   svg:'<path d="M4 3v6M6 3v6M4 6h2M4 9v8M14 3c-2 1-2 4-2 6 0 1 .5 2 2 2v6M14 3v14"/>'},
  book:   {label:'book',   lane:'intention',   svg:'<path d="M3 4h6v13H3z"/><path d="M11 4h6v13h-6z"/><path d="M9 4v13"/>'},
  movie:  {label:'movie',  lane:'intention',   svg:'<rect x="3" y="4" width="14" height="12" rx="1"/><path d="M8 4v12M13 4v12"/>'},
  hobby:  {label:'hobby',  lane:'intention',   svg:'<path d="M10 2l1.9 5.8H18l-4.9 3.6 1.9 5.8L10 13.6l-5 3.6 1.9-5.8L2 7.8h6.1z"/>'},
  art:    {label:'art',    lane:'appreciation',svg:'<rect x="3" y="3" width="14" height="14" rx="2"/><circle cx="7.5" cy="8" r="1.5"/><path d="M3 14l4.5-4.5L10 12l3-3 4 4"/>'},
  quote:  {label:'quote',  lane:'appreciation',svg:'<path d="M5 6c-1.7 0-3 1.3-3 3s1.3 3 3 3c0 2-1 3-2 3.5M14 6c-1.7 0-3 1.3-3 3s1.3 3 3 3c0 2-1 3-2 3.5"/>'},
  idea:   {label:'idea',   lane:'appreciation',svg:'<path d="M10 2a5 5 0 0 0-3 9c.6.5 1 1.3 1 2h4c0-.7.4-1.5 1-2a5 5 0 0 0-3-9z"/><path d="M8 16h4M8.5 18h3"/>'},
  other:  {label:'other',  lane:'appreciation',svg:'<circle cx="10" cy="10" r="7"/>'}
};
const REMINDER_LABELS = {weekend:'this weekend', home:'next time home', month:'in a month', norush:'no rush'};

let items = [];
let tab = 'home';
let composeType = 'place';
let composeLane = 'intention';
let composeReminder = 'weekend';
let composeDate = '';
let activeModalItem = null;
let modalStage = 'ask';
let ratingChoice = null;

function uid(){return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);}

// Storage adapter: works in the Claude preview (window.storage),
// as a downloaded file on a phone (localStorage), or in-memory as a last resort.
let memoryStore = null;
async function loadItems(){
  try{
    if(window.storage && window.storage.get){
      const r = await window.storage.get('fullcircle_items', false);
      return r && r.value ? JSON.parse(r.value) : [];
    }
  }catch(e){/* fall through */}
  try{
    const raw = localStorage.getItem('fullcircle_items');
    return raw ? JSON.parse(raw) : [];
  }catch(e){/* fall through */}
  return memoryStore ? JSON.parse(memoryStore) : [];
}
async function persist(){
  const data = JSON.stringify(items);
  memoryStore = data;
  try{
    if(window.storage && window.storage.set){
      await window.storage.set('fullcircle_items', data, false);
      return;
    }
  }catch(e){/* fall through */}
  try{ localStorage.setItem('fullcircle_items', data); }catch(e){/* in-memory only */}
}

function iconSvg(typeKey, extra){
  const t = TYPES[typeKey] || TYPES.other;
  return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">'+t.svg+'</svg>';
}

function daysAgo(ts){
  const d = Math.floor((Date.now()-ts)/86400000);
  if(d<=0) return 'today';
  if(d===1) return 'yesterday';
  return d+' days ago';
}

function computeDueAt(rule, dateStr, from){
  const base = from || Date.now();
  const d = new Date(base);
  if(rule==='weekend'){
    // next Saturday (or today if already weekend)
    const day = d.getDay();
    const daysToSat = (6-day+7)%7;
    d.setHours(9,0,0,0);
    d.setDate(d.getDate()+daysToSat);
    return d.getTime();
  }
  if(rule==='home'){
    // treat "next time home" as this evening 6pm
    d.setHours(18,0,0,0);
    if(d.getTime()<base) d.setDate(d.getDate()+1);
    return d.getTime();
  }
  if(rule==='month'){ d.setDate(d.getDate()+30); return d.getTime(); }
  if(rule==='norush'){ d.setDate(d.getDate()+60); return d.getTime(); }
  if(rule==='date' && dateStr){ return new Date(dateStr+'T09:00:00').getTime(); }
  return base + 7*86400000;
}

function isDue(it){
  if(!it.dueAt) return false;
  return it.dueAt <= Date.now();
}

function dueLabel(it){
  if(!it.dueAt) return REMINDER_LABELS[it.reminderRule]||'no rush';
  const diff = it.dueAt - Date.now();
  const days = Math.round(diff/86400000);
  if(diff<=0) return 'ready now';
  if(days===0) return 'later today';
  if(days===1) return 'tomorrow';
  if(days<14) return 'in '+days+' days';
  if(days<45) return 'in a few weeks';
  return 'someday';
}

function render(){
  const frame = document.getElementById('frame');
  const openIntentions = items.filter(i=>i.lane==='intention' && i.status==='open');
  const dueNow = openIntentions.filter(isDue).sort((a,b)=>a.dueAt-b.dueAt);
  const laterLoops = openIntentions.filter(i=>!isDue(i)).sort((a,b)=>(a.dueAt||0)-(b.dueAt||0));
  const appreciations = items.filter(i=>i.lane==='appreciation');
  const closed = items.filter(i=>i.status==='closed');

  let ringPct = 0;
  const totalIntentions = items.filter(i=>i.lane==='intention').length;
  if(totalIntentions>0) ringPct = Math.round((closed.length/totalIntentions)*100);
  const circumference = 2*Math.PI*9;
  const dash = (ringPct/100)*circumference;

  let body = '';
  if(tab==='home'){
    if(openIntentions.length===0){
      body += '<div class="section-label">worth doing soon</div>';
      body += '<div class="empty"><p>nothing waiting on you right now.<br>save something you want to do and it will show up here.</p></div>';
    } else {
      if(dueNow.length){
        body += '<div class="section-label">ready now</div>';
        dueNow.forEach(it=>{ body += cardRow(it, true); });
      }
      if(laterLoops.length){
        body += '<div class="section-label">'+(dueNow.length?'coming up':'worth doing soon')+'</div>';
        laterLoops.forEach(it=>{ body += cardRow(it, false); });
      }
      body += '<div class="shuffle-btn" id="shuffleBtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h3l8 10h3M14 5h3M3 15h3l2-2.5"/><path d="M15 3l2 2-2 2M15 13l2 2-2 2"/></svg>surprise me</div>';
    }
    body += '<div class="section-label">recently saved</div>';
    if(appreciations.length===0){
      body += '<div class="empty"><p>things you simply loved will collect here.</p></div>';
    } else {
      body += '<div class="grid">';
      appreciations.slice().reverse().slice(0,8).forEach(it=>{
        body += tile(it);
      });
      body += '</div>';
    }
  } else if(tab==='add'){
    body += renderCompose();
  } else if(tab==='profile'){
    body += renderProfile(closed, appreciations, items);
  }

  let modalHtml = '';
  if(activeModalItem){
    modalHtml = renderModal();
  }

  frame.innerHTML = `
    <header>
      <div class="wordmark">
        <svg class="ring-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="var(--ring-soft)" stroke-width="3"/>
          <circle cx="12" cy="12" r="9" fill="none" stroke="var(--ring)" stroke-width="3"
            stroke-dasharray="${dash} ${circumference}" stroke-linecap="round" transform="rotate(-90 12 12)"/>
        </svg>
        <span>fullcircle</span>
      </div>
    </header>
    <main>${body}</main>
    <nav>
      ${navBtn('home','home')}
      ${navBtn('add','add', true)}
      ${navBtn('profile','you')}
    </nav>
    ${modalHtml}
  `;
  attachHandlers();
}

function cardRow(it, isDueNow){
  const label = dueLabel(it);
  return `<div class="card ${isDueNow?'card-due':''}" data-open="${it.id}">
    <div class="icon-badge">${iconSvg(it.type)}</div>
    <div class="card-body">
      <p class="card-title">${escapeHtml(it.title)}</p>
      <p class="card-sub">${label}</p>
    </div>
    <div class="card-x" data-del="${it.id}">&times;</div>
  </div>`;
}
function tile(it){
  return `<div class="tile" data-view="${it.id}">
    <div class="icon-badge">${iconSvg(it.type)}</div>
    <div>
      <p class="tile-title">${escapeHtml(it.title)}</p>
    </div>
  </div>`;
}
function navBtn(id,label,isAdd){
  const active = tab===id ? 'active':'';
  if(isAdd){
    return `<button class="nav-btn add-btn ${active}" data-tab="${id}">
      <span class="icon-wrap"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></span>
      ${label}
    </button>`;
  }
  return `<button class="nav-btn ${active}" data-tab="${id}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="7"/></svg>${label}</button>`;
}

function renderCompose(){
  const lane = composeLane;
  let chipsHtml = '';
  if(lane==='intention'){
    chipsHtml = `
      <label>when do you want to be reminded?</label>
      <div class="chip-grid">
        ${chipBtn('weekend','this weekend')}
        ${chipBtn('home',"next time i'm home")}
        ${chipBtn('month','in a month')}
        ${chipBtn('norush','no rush')}
      </div>
      <div class="chip-grid" style="grid-template-columns:1fr;margin-top:8px;">
        <div class="ghost-btn" id="pickDateBtn" style="text-align:center;">pick a specific date</div>
      </div>
      ${composeReminder==='date' ? `<input type="date" id="dateInput" value="${composeDate}" style="margin-top:8px;"/>` : ''}
    `;
  }
  let typeChips = '';
  Object.keys(TYPES).forEach(k=>{
    const sel = k===composeType ? 'selected':'';
    typeChips += `<div class="type-chip ${sel}" data-type="${k}">
      <div class="icon-badge">${iconSvg(k)}</div>${TYPES[k].label}
    </div>`;
  });
  return `
    <label style="margin-top:8px;">what are you saving?</label>
    <input type="text" id="titleInput" placeholder="a name, a place, a title..." />
    <label>type</label>
    <div class="type-scroll">${typeChips}</div>
    <label>why did you save this? (optional)</label>
    <textarea id="whyInput" placeholder="what caught your attention..."></textarea>
    <label>this is...</label>
    <div class="lane-toggle">
      <div class="lane-opt ${lane==='appreciation'?'selected':''}" data-lane="appreciation">something i loved</div>
      <div class="lane-opt ${lane==='intention'?'selected':''}" data-lane="intention">something to do</div>
    </div>
    ${chipsHtml}
    <button class="primary-btn" id="saveBtn">save it</button>
  `;
}
function chipBtn(val,label){
  const sel = composeReminder===val ? 'selected':'';
  return `<div class="chip-btn ${sel}" data-rem="${val}">${label}</div>`;
}
function niceDate(str){
  if(!str) return 'a date';
  const d = new Date(str+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function renderProfile(closed, appreciations, all){
  const avgDays = closed.length ? Math.round(closed.reduce((s,i)=>s+((i.closedAt-i.createdAt)/86400000),0)/closed.length) : 0;
  const byType = {};
  closed.concat(appreciations).forEach(i=>{ byType[i.type]=(byType[i.type]||0)+1; });
  const maxCount = Math.max(1,...Object.values(byType));
  let bars = '';
  Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).forEach(k=>{
    const pct = Math.round((byType[k]/maxCount)*100);
    bars += `<div class="bar-row"><div class="bar-label">${TYPES[k].label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div style="font-size:12px;color:var(--ink-soft);width:16px;text-align:right;">${byType[k]}</div></div>`;
  });

  let insight = "close a few loops and i'll start noticing patterns in what you actually follow through on.";
  if(closed.length>=3){
    const topType = Object.keys(byType).sort((a,b)=>byType[b]-byType[a])[0];
    const loved = closed.filter(i=>i.rating==='loved').length;
    insight = `you tend to follow through most on ${TYPES[topType].label} items, usually within about ${avgDays} day${avgDays===1?'':'s'}. `+
      (loved>0 ? `${loved} of ${closed.length} closed loops were things you loved.` : 'not many of them have been rated highly yet.');
  }

  return `
    <div class="section-label">your taste, so far</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">closed loops</div><div class="stat-num">${closed.length}</div></div>
      <div class="stat-card"><div class="stat-label">avg time to act</div><div class="stat-num">${avgDays}d</div></div>
    </div>
    ${Object.keys(byType).length ? `<div class="section-label">where things land</div>${bars}` : ''}
    <div class="insight">${insight}</div>
  `;
}

function renderModal(){
  const it = activeModalItem;
  if(modalStage==='ask'){
    return `<div class="overlay" data-close-overlay="1"><div class="sheet" data-stop="1">
      <p class="sheet-sub">${escapeHtml(it.title)}</p>
      <p class="sheet-title">did you make it happen?</p>
      <div class="two-col" style="margin-top:16px;">
        <button class="ghost-btn" id="notYetBtn">not yet</button>
        <button class="chip-btn selected" id="yesBtn">yes, tell me more</button>
      </div>
    </div></div>`;
  }
  return `<div class="overlay" data-close-overlay="1"><div class="sheet" data-stop="1">
    <p class="sheet-sub">${escapeHtml(it.title)}</p>
    <p class="sheet-title">how was it?</p>
    <div class="two-col" style="margin-top:12px;">
      <div class="chip-btn ${ratingChoice==='loved'?'selected':''}" data-rate="loved">loved it</div>
      <div class="chip-btn ${ratingChoice==='fine'?'selected':''}" data-rate="fine">it was fine</div>
    </div>
    <div class="chip-btn ${ratingChoice==='never'?'selected':''}" data-rate="never" style="margin-top:8px;text-align:center;">never again</div>
    <textarea id="reflectNote" placeholder="anything worth remembering? (optional)" style="margin-top:12px;"></textarea>
    <button class="primary-btn" id="closeLoopBtn">close the loop</button>
  </div></div>`;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ tab = el.dataset.tab; if(tab==='add'){composeType='place';composeLane='intention';composeReminder='weekend';composeDate='';} render(); };
  });
  document.querySelectorAll('[data-type]').forEach(el=>{
    el.onclick = ()=>{ composeType = el.dataset.type; composeLane = TYPES[composeType].lane; render(); };
  });
  document.querySelectorAll('[data-lane]').forEach(el=>{
    el.onclick = ()=>{ composeLane = el.dataset.lane; render(); };
  });
  document.querySelectorAll('[data-rem]').forEach(el=>{
    el.onclick = ()=>{ composeReminder = el.dataset.rem; render(); };
  });
  const pickDateBtn = document.getElementById('pickDateBtn');
  if(pickDateBtn) pickDateBtn.onclick = ()=>{ composeReminder='date'; render(); };
  const dateInput = document.getElementById('dateInput');
  if(dateInput) dateInput.onchange = (e)=>{ composeDate = e.target.value; };

  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const title = document.getElementById('titleInput').value.trim();
    if(!title) return;
    const why = document.getElementById('whyInput').value.trim();
    const isIntention = composeLane==='intention';
    const item = {
      id: uid(),
      title, why,
      type: composeType,
      lane: composeLane,
      status: isIntention ? 'open' : null,
      reminderRule: isIntention ? composeReminder : null,
      reminderDate: composeReminder==='date' ? composeDate : null,
      dueAt: isIntention ? computeDueAt(composeReminder, composeDate) : null,
      createdAt: Date.now(),
      closedAt:null, rating:null, reflectionNote:null
    };
    items.push(item);
    await persist();
    tab='home';
    render();
  };

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ activeModalItem = items.find(i=>i.id===el.dataset.open); modalStage='ask'; ratingChoice=null; render(); };
  });
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.onclick = ()=>{ const it = items.find(i=>i.id===el.dataset.view); if(it) alert((it.why||'no note added')+' -- saved '+daysAgo(it.createdAt)); };
  });
  const shuffleBtn = document.getElementById('shuffleBtn');
  if(shuffleBtn) shuffleBtn.onclick = ()=>{
    const pool = items.filter(i=>i.lane==='intention' && i.status==='open');
    if(!pool.length) return;
    const pick = pool[Math.floor(Math.random()*pool.length)];
    activeModalItem = pick; modalStage='ask'; ratingChoice=null; render();
  };
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async (e)=>{ e.stopPropagation(); items = items.filter(i=>i.id!==el.dataset.del); await persist(); render(); };
  });

  const overlay = document.querySelector('[data-close-overlay]');
  if(overlay){
    overlay.onclick = ()=>{ activeModalItem=null; render(); };
    const sheet = document.querySelector('[data-stop]');
    if(sheet) sheet.onclick = (e)=>e.stopPropagation();
  }
  const notYetBtn = document.getElementById('notYetBtn');
  if(notYetBtn) notYetBtn.onclick = async ()=>{
    const it = items.find(i=>i.id===activeModalItem.id);
    if(it){ it.dueAt = Date.now() + 7*86400000; await persist(); }
    activeModalItem=null; render();
  };
  const yesBtn = document.getElementById('yesBtn');
  if(yesBtn) yesBtn.onclick = ()=>{ modalStage='rate'; render(); };
  document.querySelectorAll('[data-rate]').forEach(el=>{
    el.onclick = ()=>{ ratingChoice = el.dataset.rate; render(); };
  });
  const closeLoopBtn = document.getElementById('closeLoopBtn');
  if(closeLoopBtn) closeLoopBtn.onclick = async ()=>{
    const note = document.getElementById('reflectNote').value.trim();
    const it = items.find(i=>i.id===activeModalItem.id);
    it.status='closed';
    it.closedAt=Date.now();
    it.rating=ratingChoice||'fine';
    it.reflectionNote=note;
    await persist();
    activeModalItem=null;
    render();
  };
}

// Paint immediately with empty state so the UI never waits on storage/network.
try{ render(); }catch(e){ showFatal(e); }

// Then load saved data and re-render.
(async function loadAndRefresh(){
  try{
    const loaded = await loadItems();
    if(Array.isArray(loaded)) items = loaded;
    let changed = false;
    items.forEach(it=>{
      if(it.lane==='intention' && it.status==='open' && !it.dueAt){
        it.dueAt = computeDueAt(it.reminderRule||'weekend', it.reminderDate, it.createdAt);
        changed = true;
      }
    });
    if(changed) await persist();
  }catch(e){
    console.error('load error', e);
  }
  try{ render(); }catch(e){ showFatal(e); }
})();

function showFatal(e){
  const frame = document.getElementById('frame');
  if(frame) frame.innerHTML = '<div class="loading">something went wrong.<br>try reopening the app.</div>';
  console.error(e);
}
</script>
</body>
</html>
