<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Full Circle — Email confirmed</title>
<style>
  :root { --bg:#eeeae0; --surface:#fff; --ink:#26231f; --soft:#6f6a5c; --ring:#2f4a3e; --accent:#b8752f; --border:rgba(38,35,31,0.12); }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:34px 26px; max-width:380px; width:100%; text-align:center; }
  .mark { width:64px; height:64px; margin:0 auto 18px; display:block; }
  h1 { font-family:Georgia,serif; font-size:24px; margin:0 0 8px; }
  p { font-size:15px; line-height:1.55; color:var(--soft); margin:0 0 22px; }
  .btn { display:inline-block; background:var(--ring); color:#f4ede0; text-decoration:none;
         font-size:15px; font-weight:500; padding:13px 22px; border-radius:12px; }
  .hint { margin-top:16px; font-size:12.5px; color:#a39d8b; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 12 a38 38 0 1 0 30 15" fill="none" stroke="#2f4a3e" stroke-width="11" stroke-linecap="round"/>
    </svg>
    <h1>You're all set</h1>
    <p>Your email is confirmed. Open Full Circle and sign in to start saving what matters.</p>
    <a class="btn" href="fullcircle://">Open Full Circle</a>
    <div class="hint">If the button doesn't open the app, just launch Full Circle from your home screen.</div>
  </div>
</body>
</html>
